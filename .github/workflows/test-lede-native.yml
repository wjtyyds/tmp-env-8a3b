name: Test Build Lede Native
run-name: "🧪 测试: ${{ inputs.test_scenario }}"

on:
  workflow_dispatch:
    inputs:
      test_scenario:
        description: '选择要测试的场景'
        required: true
        default: 'Scene_3_Latest_DIY'
        type: choice
        options:
          - Scene_1_0916_DIY   # 跑 diy-part2.sh，注入 R26.09.16 时间戳
          - Scene_2_1011_DIY   # 跑 diy-part2.sh，注入 R26.10.11 时间戳
          - Scene_3_Latest_DIY # 跑 diy-part2.sh，不注入时间戳 (使用最新源码)
          - Scene_4_Pure_Build # 纯净版直跑：不跑 diy-part2.sh，只用你的配置编译

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Parse Scenario & Set Environment Variables
        run: |
          echo "==== 解析测试场景: ${{ inputs.test_scenario }} ===="
          
          # 默认全局变量
          echo "FIRMWARE_LOWER=lede-native" >> $GITHUB_ENV
          echo "BUILD_LOWER=public" >> $GITHUB_ENV
          
          # 根据选项分配参数
          if [[ "${{ inputs.test_scenario }}" == "Scene_1_0916_DIY" ]]; then
            echo "CUSTOM_TAG=R26.09.16" >> $GITHUB_ENV
            echo "TARGET_DATE_ISO=2026-09-16T15:59:59Z" >> $GITHUB_ENV
            echo "RUN_DIY=true" >> $GITHUB_ENV
          elif [[ "${{ inputs.test_scenario }}" == "Scene_2_1011_DIY" ]]; then
            echo "CUSTOM_TAG=R26.10.11" >> $GITHUB_ENV
            echo "TARGET_DATE_ISO=2026-10-11T15:59:59Z" >> $GITHUB_ENV
            echo "RUN_DIY=true" >> $GITHUB_ENV
          elif [[ "${{ inputs.test_scenario }}" == "Scene_3_Latest_DIY" ]]; then
            echo "CUSTOM_TAG=" >> $GITHUB_ENV
            echo "TARGET_DATE_ISO=" >> $GITHUB_ENV
            echo "RUN_DIY=true" >> $GITHUB_ENV
          elif [[ "${{ inputs.test_scenario }}" == "Scene_4_Pure_Build" ]]; then
            echo "CUSTOM_TAG=" >> $GITHUB_ENV
            echo "TARGET_DATE_ISO=" >> $GITHUB_ENV
            echo "RUN_DIY=false" >> $GITHUB_ENV
          fi
          
          # 生成隔离的测试专属 Tag (例如: Test-Scene_1_0916_DIY-20261025-1430)
          TEST_TAG="Test-${{ inputs.test_scenario }}-$(date +'%Y%m%d-%H%M')"
          echo "TEST_TAG=$TEST_TAG" >> $GITHUB_ENV
          echo "将使用独立标签: $TEST_TAG"

      - name: Init Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install clang llvm jq dwarves libelf-dev $(curl -fsSL https://ophub.org/ubuntu2204-make-openwrt-depends)
          sudo apt-get -y autoremove --purge && sudo apt-get clean

      - name: Clone LEDE Source (With Time Machine)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          REPO_URL="https://github.com/coolsnowwolf/lede"
          
          if [ -n "$TARGET_DATE_ISO" ]; then
            echo "⏳ 触发 Lede 主源码时光机，回退至: $TARGET_DATE_ISO"
            API_URL="https://api.github.com/repos/coolsnowwolf/lede/commits?sha=master&until=$TARGET_DATE_ISO&per_page=1"
            TARGET_BRANCH=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL" | jq -r '.[0].sha' 2>/dev/null || true)
            if [ "$TARGET_BRANCH" == "null" ] || [ -z "$TARGET_BRANCH" ]; then
              TARGET_BRANCH="master"
            fi
          else
            TARGET_BRANCH="master"
          fi
          
          echo "锁定哈希或分支: $TARGET_BRANCH"
          git clone $REPO_URL openwrt
          cd openwrt
          git checkout "$TARGET_BRANCH"
          
          # 清除原版自带的 helloworld (防止报错，diy脚本里会有对应处理)
          sed -i 's/^src-git helloworld/#src-git helloworld/g' feeds.conf.default

      - name: Update & Install Feeds
        run: |
          cd openwrt
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f < /dev/null

      - name: Execute diy-part2.sh (If Required)
        if: env.RUN_DIY == 'true'
        env:
          FIRMWARE_TYPE: ${{ env.FIRMWARE_LOWER }}
          BUILD_TYPE: ${{ env.BUILD_LOWER }}
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          TARGET_DATE_ISO: ${{ env.TARGET_DATE_ISO }}
          CUSTOM_TAG: ${{ env.CUSTOM_TAG }}
        run: |
          echo "🚀 正在执行自定义脚本 (diy-part2.sh)..."
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/scripts/diy-part2.sh
          $GITHUB_WORKSPACE/scripts/diy-part2.sh

      - name: Load Test Config
        run: |
          echo "====== 强制加载测试专属配置文件 ======"
          # 确保你已在仓库的 configs 目录下放了这份文件
          cp configs/lede-1025.config openwrt/.config
          
          cd openwrt
          make defconfig

      - name: Download Package & Compile
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Extract Native Firmware (.img.gz)
        run: |
          echo "====== 提取原生生成的 squashfs img.gz 镜像 ======"
          mkdir -p release_files
          
          # 去 bin/targets 目录下把所有 img.gz 找出来
          IMG_FILES=$(find openwrt/bin/targets/ -type f -name "*.img.gz")
          
          if [ -n "$IMG_FILES" ]; then
            for img in $IMG_FILES; do
               cp "$img" release_files/
               echo "✅ 成功提取: $(basename "$img")"
            done
          else
            echo "❌ 警告：找不到任何 img.gz 镜像，编译可能失败或格式不符！"
            exit 1
          fi
          
          # 顺便把你的测试配置也附带发出来，方便复盘对照
          cp openwrt/.config release_files/test_build.config

      - name: Publish Test Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TEST_TAG }}
          name: "${{ env.TEST_TAG }}"
          body: |
            ## 🚧 隔离测试版本
            - **测试场景**: `${{ inputs.test_scenario }}`
            - **输入标签 (CUSTOM_TAG)**: `${{ env.CUSTOM_TAG }}`
            - **目标日期 (TARGET_DATE)**: `${{ env.TARGET_DATE_ISO }}`
            - **配置来源**: `lede-1025.config`
            
            *此发布仅作测试对照，不会影响主线代码与正式 Release 体系。*
          files: release_files/*