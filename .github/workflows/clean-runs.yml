name: Clean Runs
on:
  workflow_dispatch:
    inputs:
      clean_target:
        description: '🎯 请选择要清理的记录类型'
        required: true
        default: '4_清理所有非成功的 (Not Success)'
        type: choice
        options:
          - '1_清理所有已成功绿色 (Success)'
          - '2_清理所有红色失败的 (Failure)'
          - '3_清理所有灰色我停止的 (Cancelled)'
          - '4_清理所有非成功的 (Not Success)'
          - '5_清理所有 (All)'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: 🗑️ 精准清理运行记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.clean_target }}
        run: |
          echo "🔍 开始扫描流水线记录，模式：$TARGET"
          
          # 根据面板选择的参数，动态生成 jq 过滤规则
          jq_filter=""
          case "$TARGET" in
            1_*)
              echo "➡️ 匹配模式：清理所有已成功 (绿色)"
              jq_filter='.[] | select(.status == "completed" and .conclusion == "success") | .databaseId'
              ;;
            2_*)
              echo "➡️ 匹配模式：清理所有失败 (红色)"
              jq_filter='.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")) | .databaseId'
              ;;
            3_*)
              echo "➡️ 匹配模式：清理所有取消/停止 (灰色)"
              jq_filter='.[] | select(.status == "completed" and .conclusion == "cancelled") | .databaseId'
              ;;
            4_*)
              echo "➡️ 匹配模式：清理所有非成功"
              jq_filter='.[] | select(.status == "completed" and .conclusion != "success") | .databaseId'
              ;;
            5_*)
              echo "➡️ 匹配模式：清理所有记录"
              jq_filter='.[] | .databaseId'
              ;;
            *)
              echo "❌ 未知的选择模式"
              exit 1
              ;;
          esac

          # 获取需要删除的记录 ID（将限制调高到 500 条一次，清理更彻底）
          runs_to_delete=$(gh run list --limit 500 --json databaseId,status,conclusion --jq "$jq_filter")
          
          if [ -n "$runs_to_delete" ]; then
            echo "🔥 发现符合条件的记录，开始逐个清理："
            for id in $runs_to_delete; do
              # 保险：排除本次正在执行的脚本自己，避免中途自尽报错
              if [ "$id" != "${{ github.run_id }}" ]; then
                echo "删除记录 ID: $id"
                gh run delete $id || true
              fi
            done
            echo "✅ 清理执行完毕！"
          else
            echo "👻 没有找到符合该条件的记录。"
          fi

      - name: 👻 终极自毁 (阅后即焚)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "✅ 脏活累活干完了，现在我将销毁我自己的本次运行记录..."
          # 利用自身的 run_id 执行自毁操作，事了拂衣去
          gh run delete ${{ github.run_id }} || true