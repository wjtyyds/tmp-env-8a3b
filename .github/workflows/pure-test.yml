name: Pure LEDE Test Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Init Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install clang llvm jq dwarves libelf-dev $(curl -fsSL https://ophub.org/ubuntu2204-make-openwrt-depends)
          sudo apt-get -y autoremove --purge && sudo apt-get clean

      - name: Clone LEDE Master
        run: |
          echo "拉取大雕最新原版源码..."
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Pure Config
        run: |
          echo "应用纯净版 .config 配置..."
          cp configs/pure-lede.config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download Package & Compile
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: Extract Native Firmware (提取原生直出镜像)
        run: |
          echo "直接提取原生生成的镜像，抛弃繁琐的 packit 打包..."
          mkdir -p firmware_output
          # 原生编译生成的 img.gz 会自动存放在 bin/targets 目录下
          find openwrt/bin/targets/ -type f -name "*.img.gz" -exec cp {} firmware_output/ \;
          echo "提取到的文件列表："
          ls -lh firmware_output/

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Pure-LEDE-N1-Native
          path: firmware_output/*.img.gz